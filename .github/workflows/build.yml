name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 打 tag 时还原签名用的 keystore；普通 push 时跳过，退化成 debug 包
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          ls -l "${GITHUB_WORKSPACE}/release.jks"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:lintRelease --no-daemon || true

      # 非 tag 分支也构建一次 release —— R8 + shrinkResources + proguard 这条链路
      # 如果只在发版那一刻才第一次被执行，崩了要么发不出去、要么发出去才发现。
      # 没配 keystore 时 release 会退回 debug 签名（见 build.gradle.kts）。
      - name: Build release variant (R8 check)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AsukaBox-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AsukaBox-${GITHUB_REF_NAME#v}.apk"
          ls -lh out

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: true
          prerelease: false
